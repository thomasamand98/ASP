server {
  listen 8080;
  root /usr/share/nginx/html;

  # .gz générés à la publication, le reste compressé à la volée
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

  # noms avec empreinte, cache long
  location /_framework/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # no-cache pour voir chaque déploiement tout de suite
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
