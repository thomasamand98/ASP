server {
  listen 8080;
  root /usr/share/nginx/html;

  # Compression : la publication .NET produit une version .gz de chaque
  # fichier (servie telle quelle si le navigateur l'accepte) ; les autres
  # réponses sont compressées à la volée.
  gzip_static on;
  gzip on;
  gzip_vary on;
  gzip_types text/css application/javascript application/json application/wasm application/octet-stream image/svg+xml;

  # Fichiers du runtime et des assemblies (.wasm, dotnet.*.js, icudt*.dat) :
  # leur nom contient une empreinte, ils peuvent être mis en cache longtemps.
  location /_framework/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Tout le reste (index.html avec sa table d'import, appsettings.json,
  # interop.js, feuilles de style) : revalidé à chaque chargement, pour que
  # chaque déploiement soit visible immédiatement. Une URL inconnue renvoie
  # l'application.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
