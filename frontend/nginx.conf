server {
  listen 8080;
  root /usr/share/nginx/html;

  # Fichiers compilés par Vite (nom contenant un hash) : mis en cache longtemps.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Tout le reste renvoie l'application, jamais mise en cache pour que chaque
  # déploiement soit visible immédiatement.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
