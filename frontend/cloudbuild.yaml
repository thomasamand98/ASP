# Déploiement continu du frontend sur Google Cloud Run (service `front`).
# _API_URL (URL du backend, ex. https://mvc-xxxx.europe-west1.run.app) se
# renseigne dans les « variables de substitution » du déclencheur.
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    dir: frontend
    args: ['build', '--build-arg', 'VITE_API_URL=${_API_URL}', '-t', 'gcr.io/$PROJECT_ID/front:$COMMIT_SHA', '.']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/front:$COMMIT_SHA']

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', 'front', '--image', 'gcr.io/$PROJECT_ID/front:$COMMIT_SHA', '--region', 'europe-west1', '--port', '8080']

images: ['gcr.io/$PROJECT_ID/front:$COMMIT_SHA']

substitutions:
  _API_URL: ''

options:
  logging: CLOUD_LOGGING_ONLY
