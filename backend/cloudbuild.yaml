# Déploiement continu sur Google Cloud Run : à chaque push sur main, le
# déclencheur Cloud Build construit l'image du backend, l'envoie dans le
# registre puis met à jour le service `mvc`. Les variables, secrets et la
# connexion Cloud SQL du service sont conservés (seule l'image change).
steps:
  - id: Build
    name: gcr.io/cloud-builders/docker
    dir: backend
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/mvc:$COMMIT_SHA', '.']

  - id: Push
    name: gcr.io/cloud-builders/docker
    args: ['push', 'gcr.io/$PROJECT_ID/mvc:$COMMIT_SHA']

  - id: Deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args: ['run', 'deploy', 'mvc', '--image', 'gcr.io/$PROJECT_ID/mvc:$COMMIT_SHA', '--region', 'europe-west1']

images: ['gcr.io/$PROJECT_ID/mvc:$COMMIT_SHA']

options:
  logging: CLOUD_LOGGING_ONLY
