# docker compose up --build : front sur :8080, API sur :3000
# overrides possibles dans .env : MYSQL_*, JWT_SECRET, MISTRAL_API_KEY, LOGIN_SCREEN
# hors localhost:8080, changer API_URL et CORS_ORIGIN ensemble

services:
  # base vide au 1er lancement (db/schema), reset avec down -v
  db:
    image: mysql:8.4
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    environment:
      MYSQL_DATABASE: horizon
      MYSQL_USER: horizon
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-horizon}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-horizon-root}
    volumes:
      - db-data:/var/lib/mysql
      - ./db/schema:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-horizon-root}"]
      interval: 5s
      timeout: 5s
      retries: 30

  api:
    build:
      context: .
      dockerfile: src/Api/Dockerfile
    environment:
      DATABASE_URL: mysql://horizon:${MYSQL_PASSWORD:-horizon}@db:3306/horizon
      PORT: "3000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      # vide = secret temporaire, sessions perdues au redémarrage
      JWT_SECRET: ${JWT_SECRET:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
    volumes:
      - storage:/app/storage
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/Web/Dockerfile
    environment:
      API_URL: ${API_URL:-http://localhost:3000}
      LOGIN_SCREEN: ${LOGIN_SCREEN:-false}
    ports:
      - "8080:8080"
    depends_on:
      - api

volumes:
  db-data:
  storage:
